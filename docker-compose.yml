services:
  chatbot:
    build: .
    stdin_open: true
    tty: true
    environment:
      # Required: OpenAI API key
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Optional: model override (default: gpt-4o-mini)
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # Optional: ORACLE overseer URL
      ORACLE_URL: ${ORACLE_URL:-}
