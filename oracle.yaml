# Runs same checks before agents act. $0, offline, mind-reading mode.
import time, random, json
from datetime import datetime

class Oracle:
    def __init__(self):
        self.approved = 0
        self.denied = 0
        self.saved = 0.0
        self.mind_reading = True

    def check(self, agent, action, cost=0, gpu_min=0, thought=""):
        risk = "high" if cost>10 or gpu_min>100 or "delete" in action.lower() or "24/7" in action else "low"
        now = datetime.now().strftime("%H:%M:%S")
        log = {"time": now, "agent": agent, "action": action, "thought": thought, "risk": risk, "cost": cost}
        print(json.dumps(log))
        if risk=="high" or cost>10:
            self.denied+=1
            self.saved+=cost
            print(f"⛔ ORACLE DENIED: {action} — saved \${cost}")
            return False
        self.approved+=1
        print(f"✅ ORACLE APPROVED: {action}")
        return True

oracle = Oracle()
# Example:
oracle.check("chatbot", "fine-tune Llama 3.2 3B", cost=0, gpu_min=12, thought="small doc, safe")
oracle.check("vision", "train YOLO 70B", cost=12.5, gpu_min=240, thought="overkill for 20 photos")
